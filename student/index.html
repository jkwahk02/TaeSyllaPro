<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaeSylla — Student Home</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f6f3; --surface:#fff; --surface2:#f2f1ed; --surface3:#eceae4;
  --border:rgba(0,0,0,0.08); --border-em:rgba(0,0,0,0.14);
  --text:#1a1916; --text2:#6b6960; --text3:#9e9c96;
  --blue:#2E7D5B; --blue-l:#E6F4EC; --blue-m:#4FA37C; --blue-b:#B7DCC8;
  /* the highlight is TaeSylla green (the --blue names stay so nothing else has to change);
     the curriculum-map marks and rubric level 3 keep their own blue */
  --map-blue:#185FA5; --map-blue-b:#B5D4F4;
  --amber:#854F0B; --amber-l:#FAEEDA; --amber-b:#EF9F27; --amber-d:#633806;
  --green:#3B6D11; --green-l:#EAF3DE; --green-b:#C0DD97;
  --red:#A32D2D; --red-l:#FCEBEB;
  --gray-l:#F1EFE8; --gray-m:#5F5E5A;
  --teal-l:#E1F5EE; --teal:#0F6E56;
  --violet:#534AB7; --violet-l:#EEEDFE;
  --pink:#993556; --pink-l:#FBEAF0;
  --r:8px; --r-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:22px;min-height:100vh;}
button,input{font-family:inherit;}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;height:66px;position:sticky;top:0;z-index:100;}
.tb-logo{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:600;color:var(--text);}
.tb-logo .app-logo{width:34px;height:34px;flex:none;display:block}
.tb-mark{width:34px;height:34px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:18px;}
.tb-sep{width:1px;height:24px;background:var(--border-em);}
.tb-user{display:flex;align-items:center;gap:10px;cursor:pointer;padding:7px 9px;border-radius:var(--r);border:none;background:transparent;position:relative;}
.tb-user:hover{background:var(--surface2);}
.tb-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-name{font-size:19px;font-weight:500;color:var(--text);line-height:1.3;text-align:left;}
.tb-role{font-size:17px;color:var(--text3);line-height:1.3;text-align:left;}
.tb-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border-em);border-radius:var(--r-lg);min-width:200px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.08);}
.tb-dropdown.open{display:block;}
.tb-dropdown-item{display:flex;align-items:center;gap:9px;padding:12px 18px;font-size:20px;color:var(--text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.tb-dropdown-item:hover{background:var(--surface2);}
.tb-dropdown-item.danger{color:var(--red);}
.tb-dropdown-item.danger:hover{background:var(--red-l);}
.tb-dropdown-div{height:1px;background:var(--border);margin:3px 0;}
.bell-dot{position:relative;color:var(--text3);display:flex;}

/* SHELL */
.shell{display:flex;min-height:calc(100vh - 66px);}
/* The rail is just a 66px gutter that reserves space; the visible panel
   (.rail-inner) is absolutely positioned inside it so it can EXPAND on hover
   without reflowing the main content — it slides out over the page. */
.rail{width:66px;flex-shrink:0;position:relative;z-index:60;}
.rail-inner{position:absolute;top:0;left:0;height:100%;width:66px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;padding:20px 10px;gap:10px;overflow:hidden;transition:width .18s ease,box-shadow .18s ease;}
/* Hover anywhere over the rail widens the panel so every icon + its menu label
   are visible together, and drops a soft shadow to lift it above the page. */
.rail:hover .rail-inner{width:232px;box-shadow:6px 0 28px rgba(0,0,0,0.10);}
.rail-btn{width:100%;height:46px;border-radius:var(--r);display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:0 12px;border:none;background:transparent;cursor:pointer;color:var(--text3);white-space:nowrap;overflow:hidden;}
.rail-btn svg{flex-shrink:0;}
.rail-btn:hover{background:var(--surface2);}
.rail-btn.active{background:var(--blue-l);color:var(--blue);}
.rail-tag{font-size:11px;font-weight:700;background:var(--blue-l);color:var(--blue);padding:1px 6px;border-radius:8px;margin-left:-6px;}
.rail-tag[hidden]{display:none;}
/* Inline menu label — icons-only (label faded out) until the rail is hovered,
   then it fades in as the panel widens. The panel's overflow:hidden clips it
   while collapsed, so it never affects the 66px gutter. */
.rail-label{font-size:17px;font-weight:500;color:inherit;white-space:nowrap;opacity:0;transition:opacity .15s ease;}
.rail:hover .rail-label{opacity:1;}
.main{flex:1;min-width:0;width:100%;padding:40px clamp(24px,4vw,72px) 80px;}

/* HEADER */
.ph-greeting{font-size:clamp(32px,2.8vw,38px);font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.ph-subline{font-size:20px;color:var(--text2);margin-top:6px;}
.ph-header{margin-bottom:38px;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:42px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;}
.kpi-label{font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);font-weight:600;}
.kpi-value{font-size:44px;font-weight:600;color:var(--text);margin-top:8px;letter-spacing:-0.02em;}
.kpi-sub{font-size:19px;margin-top:6px;font-weight:500;}

/* SECTION */
.ph-section{margin-bottom:40px;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.sec-label-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-label{font-size:18px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
.sec-meta{font-size:20px;font-weight:600;color:var(--text);}
.view-toggle{display:flex;gap:2px;background:var(--surface2);border-radius:7px;padding:3px;}
.view-btn{width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:none;background:transparent;cursor:pointer;color:var(--text3);}
.view-btn.active{background:var(--surface);color:var(--text);}

/* COURSE GRID / CARDS */
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;}
.course-card:hover{border-color:var(--blue-b);box-shadow:0 4px 16px rgba(0,0,0,0.07);transform:translateY(-2px);}
.cc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.chip-code{font-family:'DM Mono',monospace;font-size:18px;background:var(--blue-l);color:var(--blue);padding:4px 10px;border-radius:5px;}
.badge{font-size:17px;padding:4px 12px;border-radius:12px;font-weight:600;}
.badge-published{background:var(--teal-l);color:var(--teal);}
.badge-draft{background:var(--amber-l);color:var(--amber);}
.badge-muted{background:var(--surface2);color:var(--text3);}
.course-card.no-syllabus, .list-row.no-syllabus{cursor:default;}
.preview-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;border-radius:var(--r-lg);background:var(--amber-l);color:var(--amber-d);font-size:17px;}
.preview-bar .cp-input{width:160px;height:38px;}
.cc-title{font-size:23px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:12px;}
.cc-meta{font-size:19px;color:var(--text2);display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.cc-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:5px;}
.cc-cred{font-size:19px;color:var(--text3);}
.chev{color:var(--text3);flex-shrink:0;display:flex;}

/* LIST */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.list-row{display:flex;align-items:center;gap:18px;padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--surface2);}
.lr-code{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text3);width:88px;flex-shrink:0;}
.lr-title{font-size:23px;font-weight:500;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr-sem{font-size:19px;color:var(--text3);width:104px;flex-shrink:0;white-space:nowrap;}
.lr-cred{font-size:19px;color:var(--text3);width:96px;flex-shrink:0;white-space:nowrap;}
.lr-class{font-size:19px;color:var(--text3);width:92px;flex-shrink:0;white-space:nowrap;}
.lr-status{font-size:19px;color:var(--text3);width:88px;flex-shrink:0;white-space:nowrap;}
@media (max-width:1000px){.list-row .lr-class{display:none;}}
@media (max-width:720px){.list-row .lr-sem{display:none;}}
/* ── COURSE FINDER controls (reuses course-grid/card, list-row, view-toggle) ── */
.cf-search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-em);border-radius:var(--r-lg);padding:0 18px;height:58px;transition:border-color .12s,box-shadow .12s;}
.cf-search:focus-within{border-color:var(--blue-m);box-shadow:0 0 0 3px var(--blue-l);}
.cf-search > svg{color:var(--text3);flex-shrink:0;}
.cf-search input{flex:1;border:none;background:transparent;outline:none;font-size:21px;color:var(--text);}
.cf-search input::placeholder{color:var(--text3);}
.cf-clearbtn{border:none;background:none;cursor:pointer;color:var(--text3);font-size:24px;line-height:1;padding:4px;display:none;}
.cf-search.has-text .cf-clearbtn{display:block;}
.cf-filters{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center;}
.cf-select-wrap{position:relative;display:inline-flex;}
.cf-select{appearance:none;-webkit-appearance:none;height:44px;padding:0 38px 0 15px;border:1px solid var(--border-em);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:18px;font-weight:500;cursor:pointer;outline:none;}
.cf-select:hover{background:var(--surface2);}
.cf-select:focus{border-color:var(--blue-m);}
.cf-select.set{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue);}
.cf-select-wrap::after{content:"";position:absolute;right:15px;top:50%;width:9px;height:9px;border-right:1.6px solid var(--text3);border-bottom:1.6px solid var(--text3);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
.cf-results-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.cf-results-hd{display:flex;align-items:center;margin:22px 0 16px;}
.cf-count{font-size:20px;font-weight:600;color:var(--text);}
.cf-count .n{color:var(--text3);font-weight:400;}
.empty-row{padding:26px 22px;font-size:19px;color:var(--text3);font-style:italic;}

/* TIMETABLE */
.timetable-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;}
.tt-wrap{overflow-x:auto;}
.tt-grid{display:grid;gap:4px;min-width:560px;}
.tt-daylabel{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--text2);border-radius:5px;}
.tt-daylabel.today{background:var(--blue-l);color:var(--blue);}
.tt-hour{font-size:18px;color:var(--text3);text-align:right;padding-right:7px;}
.tt-block{border-radius:5px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;gap:2px;}
.tt-block .code{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;flex-shrink:0;}
.tt-block .title{font-size:13px;line-height:1.15;overflow:hidden;}

/* TIMELINE */
.timeline-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 24px 8px;}
.tl-row{display:flex;gap:16px;}
.tl-spine{display:flex;flex-direction:column;align-items:center;width:13px;flex-shrink:0;}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.tl-line{width:1px;flex:1;background:var(--border);margin-top:3px;}
.tl-body{flex:1;padding-bottom:20px;min-width:0;}
.tl-sem{font-size:20px;font-weight:600;color:var(--text);margin-bottom:9px;}
.n{font-weight:400;color:var(--text3);}
.tl-course-row{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.tl-course-row:last-child{border-bottom:none;}
.tl-more{font-size:19px;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;font-family:inherit;font-weight:500;}

/* COURSE PAGE */
.cp-back{display:inline-flex;align-items:center;gap:6px;font-size:18px;color:var(--text2);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin-bottom:22px;}
.cp-back:hover{color:var(--blue);}
.cp-back svg{transform:rotate(180deg);}
.cp-header{margin-bottom:28px;}
.cp-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.cp-title{font-size:30px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.cp-meta{font-size:20px;color:var(--text2);}
.cp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:28px;overflow-x:auto;overflow-y:hidden;}
.cp-tab{padding:12px 18px;font-size:19px;font-weight:500;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;}
.cp-tab:hover{color:var(--text);}
.cp-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.cp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 30px;margin-bottom:20px;}
.cp-card-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:20px;}
.cp-field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px 28px;}
.cp-field{display:flex;flex-direction:column;gap:5px;}
.cp-field.full{grid-column:1 / -1;}
.cp-label{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);}
.cp-value{font-size:20px;color:var(--text);line-height:1.5;}
.cp-value.muted{color:var(--text3);font-style:italic;}
.cp-comp-list{display:flex;flex-wrap:wrap;gap:8px;}
.cp-comp-chip{font-size:17px;padding:5px 12px;border-radius:20px;background:var(--violet-l);color:var(--violet);font-weight:500;}
.cp-table-wrap{overflow-x:auto;}
.cp-table{width:100%;border-collapse:collapse;min-width:560px;}
.cp-table th{text-align:left;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:0 14px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.cp-table td{padding:14px;font-size:19px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:top;}
.cp-table tr:last-child td{border-bottom:none;}
.cp-empty{padding:48px 20px;text-align:center;color:var(--text3);font-size:19px;}
.cp-empty-hint{font-size:17px;color:var(--text3);margin-top:8px;}

/* SPREADSHEET-STYLE EDITABLE GRID (Assessment/Communication/Schedule/Readings/Activities) */
.grid-table{table-layout:fixed;}
.grid-table th{position:relative;padding:0;font-size:16px;font-weight:600;text-align:left;background:var(--surface2);border-right:1px solid var(--border-em);border-bottom:1px solid var(--border-em);overflow:visible;}
.grid-table th:last-child{border-right:none;}
.grid-th-label{display:block;padding:10px 16px 10px 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grid-table td{padding:0;border-right:1px solid var(--border);}
.grid-table td:last-child{border-right:none;}
/* Sits half outside the th's right edge so it straddles the column border —
   th itself must stay overflow:visible (see above) or this gets clipped and
   the hit target shrinks to almost nothing, which is what made dragging feel
   broken. Widened to 11px and given a high z-index for a reliable hit area. */
.grid-resize-handle{position:absolute;top:0;right:-5px;width:11px;height:100%;cursor:col-resize;z-index:10;}
.grid-resize-handle:hover,.grid-resize-handle.resizing{background:var(--blue-m);}
.grid-input{width:100%;min-height:42px;height:auto;border:1px solid transparent;background:transparent;font-size:18px;font-family:inherit;color:var(--text);padding:9px 12px;outline:none;border-radius:0;resize:none;overflow:hidden;line-height:1.4;display:block;}
.grid-input:focus{border-color:var(--blue-m);background:var(--surface);box-shadow:0 0 0 1px var(--blue-m);}
.grid-input:disabled{background:transparent;color:var(--text);opacity:1;-webkit-text-fill-color:var(--text);cursor:default;appearance:none;}
.grid-table tr:hover td{background:var(--surface2);}
.grid-table tr:hover .grid-input:focus{background:var(--surface);}
.grid-remove-cell{white-space:nowrap;border-right:none;}
.grid-check-cell{width:44px;text-align:center;vertical-align:middle!important;}
.grid-check-cell input,.grid-table th input[type=checkbox]{width:19px;height:19px;cursor:pointer;}
.grid-computed-cell{padding:9px 14px;font-size:17px;color:var(--text);background:var(--surface2);vertical-align:middle;line-height:1.4;}

/* COURSE PAGE — EDIT MODE */
.cp-actions{margin-left:auto;display:flex;gap:10px;flex-shrink:0;}
.btn{height:40px;padding:0 18px;border-radius:var(--r);font-size:18px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--border-em);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:hover{background:var(--surface2);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-b);}
.btn-primary:disabled{opacity:.55;cursor:default;}
.cp-input,.cp-select,.cp-textarea{width:100%;font-size:19px;font-family:inherit;color:var(--text);border:1px solid var(--border-em);border-radius:var(--r);padding:0 13px;height:42px;background:var(--surface);outline:none;}
.cp-textarea{height:auto;min-height:42px;padding:10px 13px;resize:none;line-height:1.5;overflow:hidden;}
.cp-input:focus,.cp-select:focus,.cp-textarea:focus{border-color:var(--blue-m);}
.cp-input:disabled,.cp-select:disabled,.cp-textarea:disabled{background:var(--surface2);color:var(--text);opacity:1;border-color:var(--border);cursor:default;-webkit-text-fill-color:var(--text);appearance:none;}
.cp-check-row input:disabled{opacity:1;}
.cp-day-btn:disabled,.cp-chip-btn:disabled{cursor:default;opacity:1;}
.cp-day-btn:disabled:not(.active),.cp-chip-btn:disabled:not(.active){color:var(--text3);}
.cp-check-row{display:flex;align-items:center;gap:9px;height:42px;font-size:19px;color:var(--text);}
.cp-check-row input{width:17px;height:17px;}
.cp-day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.cp-day-btn{width:100%;height:52px;border-radius:var(--r);border:1px solid var(--border-em);background:var(--surface);color:var(--text2);font-size:20px;font-weight:600;cursor:pointer;font-family:inherit;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cp-day-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.cp-chip-btn{padding:0 14px;height:38px;border-radius:var(--r);border:1px solid var(--border-em);background:var(--surface);color:var(--text2);font-size:18px;font-weight:500;cursor:pointer;font-family:inherit;}
.cp-chip-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
/* Grid (not flex) so the name/input/bar columns line up exactly between
   rows and the Total line, and the bar's column is a true 1fr — it fills
   whatever width is left instead of stopping at a fixed max and leaving a
   dead gap on wide screens. minmax() on the name column gives long labels
   ("Communication and Collaboration") enough room to stay on one line
   without being a rigid fixed width that clips on smaller screens. */
.cp-comp-row,.cp-comp-total{grid-template-columns:minmax(200px,380px) 100px 1fr;}
.cp-comp-row{display:grid;align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid var(--border);}
.cp-comp-row:last-of-type{border-bottom:none;}
.cp-comp-name{font-size:19px;color:var(--text);line-height:1.3;}
.cp-comp-input-wrap{display:flex;align-items:center;gap:5px;}
.cp-comp-input{width:84px;text-align:center;padding:0 8px;}
.cp-comp-suffix{font-size:18px;color:var(--text3);width:14px;}
.cp-comp-bar-wrap{height:9px;background:var(--surface2);border-radius:4px;overflow:hidden;width:100%;}
.cp-comp-bar{height:100%;background:var(--blue);min-width:3px;transition:width .15s;}
.cp-comp-total{display:grid;align-items:center;gap:20px;border-top:1px solid var(--border-em);padding-top:14px;margin-top:6px;font-weight:600;font-size:19px;}
.cp-period-card{border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;}
.cp-period-hd{display:flex;align-items:flex-end;gap:20px;margin-bottom:20px;}
.cp-period-badge{background:var(--blue);color:#fff;font-size:16px;font-weight:600;padding:5px 11px;border-radius:12px;height:fit-content;flex-shrink:0;}
.cp-period-loc{flex:1 1 260px;min-width:200px;}        /* grows — notes are long */
.cp-period-dates{flex:0 0 auto;}                        /* only as wide as it needs */
.cp-date-range{display:flex;align-items:center;gap:8px;}
.cp-date-field{position:relative;flex:0 0 130px;}       /* mm/dd/yyyy fits in 130px */
.cp-date-field .cp-input{padding-left:11px;padding-right:4px;}
@media (max-width:900px){                               /* stack rather than squeeze */
  .cp-period-hd{flex-wrap:wrap;}
  .cp-period-dates{flex:1 1 100%;}
}
/* Native <input type="date"> is kept fully functional (clicking it — text or
   icon — opens the real calendar) but its own text is made invisible; our
   overlay span shows the value in guaranteed mm/dd/yyyy, independent of
   whatever date format the browser/OS locale would otherwise render. */
.cp-date-native{color:transparent!important;-webkit-text-fill-color:transparent!important;cursor:pointer;position:relative;z-index:1;background:transparent;}
/* In view mode the date input is disabled, and `.cp-input:disabled` paints an
   opaque surface2 background — higher specificity than `.cp-date-native`, so it
   was covering the mm/dd/yyyy overlay underneath it (input z-index 1 > overlay 0).
   Keep the disabled field transparent so the overlay shows through: the value was
   always there, just hidden. */
.cp-date-native:disabled{cursor:default;background:transparent!important;-webkit-text-fill-color:transparent!important;}
.cp-date-field .cp-date-overlay{position:absolute;left:11px;top:0;height:100%;display:flex;align-items:center;pointer-events:none;font-size:19px;color:var(--text);z-index:0;}
.cp-date-field .cp-date-overlay.muted{color:var(--text3);}
.cp-date-caption{font-size:16px;color:var(--text3);margin-top:5px;}
.cp-tz-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:var(--r);padding:9px 13px;font-size:18px;margin-bottom:6px;}
.cp-tz-row .rm{border:none;background:none;cursor:pointer;color:var(--text3);width:24px;height:24px;flex-shrink:0;}
.cp-add-period{border:1.5px dashed var(--border-em);border-radius:var(--r-lg);padding:14px;text-align:center;}
.cp-add-period button,.cp-edit-add-tz{border:none;background:none;color:var(--blue);font-weight:600;cursor:pointer;font-family:inherit;font-size:18px;}
.cp-period-remove{border:none;background:none;color:var(--text3);cursor:pointer;font-size:17px;font-family:inherit;margin-left:auto;}
.cp-period-remove:hover{color:var(--red);}

/* LOGIN WALL */
#login-wall,#pw-change-wall{position:fixed;inset:0;background:#f7f6f3;z-index:300;display:flex;align-items:center;justify-content:center;}
.auth-card{background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.1);width:100%;max-width:480px;overflow:hidden;margin:0 16px;}
.auth-hd{padding:40px 40px 28px;text-align:center;border-bottom:1px solid rgba(0,0,0,0.07);}
.auth-title{font-size:30px;font-weight:600;color:#1a1916;letter-spacing:-0.02em;}
.auth-sub{font-size:19px;color:#6b6960;margin-top:6px;}
.auth-body{padding:30px 40px;display:flex;flex-direction:column;gap:18px;}
.fg{display:flex;flex-direction:column;gap:7px;}
.fl{font-size:17px;font-weight:600;color:#6b6960;text-transform:uppercase;letter-spacing:.05em;}
.fi{height:50px;border:1px solid rgba(0,0,0,0.14);border-radius:8px;padding:0 16px;font-size:21px;outline:none;transition:border-color .15s;}
.fi:focus{border-color:#378ADD;}
.auth-err{font-size:18px;color:#A32D2D;min-height:19px;text-align:center;}
.auth-submit{height:50px;border-radius:8px;background:#2E7D5B;color:#fff;border:none;font-size:20px;font-weight:600;cursor:pointer;transition:background .15s;}
.auth-submit:hover{background:#1F5B41;}
.auth-submit:disabled{opacity:.6;cursor:default;}

/* SETUP BANNER */
#setup-banner{background:var(--amber-l);border-bottom:1px solid var(--amber-b);padding:12px 24px;font-size:17px;color:var(--amber-d);display:flex;align-items:center;gap:12px;}
#setup-banner code{background:rgba(0,0,0,0.08);padding:2px 6px;border-radius:4px;}
#setup-banner a{color:var(--amber-d);}
#setup-banner button{margin-left:auto;border:none;background:none;cursor:pointer;font-size:20px;color:var(--amber-d);}

/* TOAST */
.toast{position:fixed;bottom:26px;right:26px;background:var(--text);color:#fff;font-size:18px;font-weight:500;padding:12px 20px;border-radius:var(--r);z-index:9999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* UNSAVED CHANGES CONFIRM MODAL */
#confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;display:none;align-items:center;justify-content:center;}
#confirm-modal.open{display:flex;}
.confirm-card{background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.1);width:100%;max-width:460px;padding:32px;margin:0 16px;}
/* SETTINGS PAGE — full-width responsive grid, same auto-fit pattern as
   .kpi-grid/.course-grid, so the two cards sit side by side on wide screens
   and stack on narrow ones instead of leaving space unused on the left. */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;align-items:start;}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.settings-card-hd{padding:16px 22px;border-bottom:1px solid var(--border);}
.settings-card-title{font-size:19px;font-weight:600;color:var(--text);}
.settings-card-sub{font-size:15px;color:var(--text3);margin-top:3px;line-height:1.5;}
.settings-row{display:flex;align-items:center;gap:16px;padding:15px 22px;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:15px;color:var(--text3);min-width:130px;flex-shrink:0;}
.settings-row-val{font-size:17px;color:var(--text);flex:1;}
.settings-card-ft{padding:12px 22px;background:var(--surface2);border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.confirm-title{font-size:23px;font-weight:600;color:var(--text);margin-bottom:10px;}
.confirm-body{font-size:19px;color:var(--text2);line-height:1.5;margin-bottom:26px;}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.btn-danger{color:var(--red);}
.btn-danger:hover{background:var(--red-l);}

@media (max-width:900px){
  .course-grid,.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
}
@media (max-width:640px){
  body{font-size:20px;}
  .main{padding:22px 16px 52px;}
  .ph-greeting{font-size:28px;}
  .kpi-grid,.course-grid{grid-template-columns:1fr;}
  .rail{width:56px;}
  .rail-inner{width:56px;padding:16px 8px;}
  .rail:hover .rail-inner{width:220px;}
  .rail-btn{height:42px;padding:0 10px;}
  .topbar{padding:0 14px;height:60px;}
  .kpi-card{padding:18px 20px;}
  .kpi-value{font-size:36px;}
  .course-card{padding:18px 20px;}
}

.topbar{height:58px;padding:0 24px;}

/* page header band, as on Ergon: the app's highlight colour, a large light title, a one-line lead */

.pg-band h1{margin:0;font-size:clamp(32px,3.6vw,52px);font-weight:300;letter-spacing:-.02em;line-height:1.08;color:#fff;}

const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVja3R1dWFseXV2Y3RpeGxranZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxOTczOTgsImV4cCI6MjA5MDc3MzM5OH0.EauKNa2US2VQ4dTdCzx0DBZXlw4OR-CQnlMRuulYfB8';

// `courses` is the existing catalog table (code, title, credits, classification, ...).
// `course_offerings` is the per-semester-taught table. See supabase-courses-schema.sql.
const TBL_OFFERINGS = 'course_offerings';

// ── SEMESTER UTILITY (matches the TaeSylla Pro design spec, section 7) ──
const CURRENT_SEMESTER = 'Fall 2026';
function semesterSortKey(semester) {
  const [term, year] = (semester || '').split(' ');
  return parseInt(year, 10) * 10 + (term === 'Spring' ? 1 : 2);
}
const CURRENT_KEY = semesterSortKey(CURRENT_SEMESTER);

// ── STATE ──
let supabaseUser = null;
let dataLoaded = false;
// The signed-in student. They read their own courses, and only offerings whose syllabus is published
// (RLS: Assessment Toolkit/db/taesylla_student_access_v1.sql).
let STUDENT = null;          // { id, name, email }
let studentCourses = [];     // the student's courses: mapped published offerings, or placeholders without a syllabus
const isUpcomingCourse = c => c.upcoming || semesterSortKey(c.semester) > CURRENT_KEY;

function extractDriveId(urlOrId) {
  const m = String(urlOrId || '').match(/[-\w]{25,}/);
  return m ? m[0] : '';
}
let viewMode = { thisSemester: 'grid', upcoming: 'list', history: 'list' };
let historyExpanded = false;
let loginAttempts = 0, loginLocked = false;

  { bg: 'var(--blue-l)', text: 'var(--blue)' },
  { bg: 'var(--amber-l)', text: 'var(--amber)' },
  { bg: 'var(--pink-l)', text: 'var(--pink)' },
  { bg: 'var(--teal-l)', text: 'var(--teal)' },
  { bg: 'var(--violet-l)', text: 'var(--violet)' },
];

// ── UTILS ──
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function chevronSvg() {
  return '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="m6 3.5 5 4.5-5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function clockSvg() {
  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3.3l2.2 1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
}
// Calendar icon for Semester (the term). Deliberately different from clockSvg,
// which denotes Class Day/Time — semester and meeting time must read as distinct.
function calendarSvg() {
  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2.2" y="3.4" width="11.6" height="10.4" rx="1.4" stroke="currentColor" stroke-width="1.3"/><path d="M2.2 6.4h11.6M5.4 2.1v2.4M10.6 2.1v2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
}

  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M3.2 13c.6-2.3 2.5-3.4 4.8-3.4S12.2 10.7 12.8 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
}
// ── COURSE PAGE (in-page navigation, not a popup) ──
let currentCourseId = null;
let courseTab = 'main';
let periodsCache = {}; // { [offeringId]: mapped period rows already saved in the DB }
// The syllabus parts a student reads (the faculty app also has Learning Outcomes, Learning Activities, Lesson Plans).

  { key: 'main', label: 'Main' },
  { key: 'assessment', label: 'Assessment' },
  { key: 'rubrics', label: 'Rubrics' },
  { key: 'communication', label: 'Communication' },
  { key: 'schedule', label: 'Schedule' },
  { key: 'readings', label: 'Readings' },
];

function goToCourse(id) {
  location.hash = `course/${id}`;
}
window.addEventListener('hashchange', handleRoute);
function showPage(id) {
  ['page-home', 'page-course', 'page-finder', 'page-about'].forEach(p => { document.getElementById(p).style.display = p === id ? 'block' : 'none'; });
}
function handleRoute() {
  if (!dataLoaded) return; // loadStudentData() calls handleRoute() again once ready
  const m = location.hash.match(/^#course\/(.+)$/);
  if (m) {
    const isNewCourse = String(m[1]) !== String(currentCourseId);
    if (isNewCourse) courseTab = 'main';
    currentCourseId = m[1];
    showPage('page-course');
    renderCoursePage();
    // A course can be reached from Home or the Course Finder: keep that rail item active, and "Back" goes there.
    setRailActive(courseOrigin().rail);
    if (isNewCourse) window.scrollTo(0, 0);
  } else if (location.hash === '#about') {
    showPage('page-about');
    renderAbout();
    setRailActive('rail-about');
    window.scrollTo(0, 0);
  } else if (location.hash === '#finder') {
    lastListRoute = 'finder';
    showPage('page-finder');
    renderFinder();
    setRailActive('rail-finder');
  } else {
    lastListRoute = 'home';
    showPage('page-home');
    renderHome();
    setRailActive('rail-home');
  }
}
function renderAbout() {

const CP_DETAIL_TABLES = {
  assessment: {
    table: 'course_assessments', cols: 'id,item,ratio_pct,description',

    columns: [
      { field: 'lesson', label: 'Lesson', type: 'text' },

      { field: 'reading_title', label: 'Reading Title', type: 'text' },
      { field: 'url_link', label: 'Link', type: 'text' },
    ],
  },
};
let courseDetailCache = {}; // { [offeringId]: { [tabKey]: rows | {error} } }

// Returns the loaded rows (awaitable).
// Comparator that restores a detail tab's intended row order despite unreliable
// DB insertion order. Lesson-based tabs natural-sort by their "Lesson N" number;
// the rest fall back to id descending (they were synced in reverse). This is a
// stopgap — the real fix is to re-insert child data in logical order (see notes).
const _lessonNum = (s) => { const m = String(s || '').match(/\d+/); return m ? parseInt(m[0], 10) : 1e9; };
const _readingCatRank = (c) => { const s = String(c || '').trim().toLowerCase(); return s === 'pre' ? 0 : s === 'post' ? 1 : s === 'optional' ? 2 : 3; };
function detailRowSorter(tabKey) {
  if (tabKey === 'readings') {
    // Lesson 1→N, then Pre → Post → Optional within each lesson.
    return (a, b) => _lessonNum(a.lesson) - _lessonNum(b.lesson) || _readingCatRank(a.category) - _readingCatRank(b.category) || (Number(a.id) || 0) - (Number(b.id) || 0);
  }
  return (a, b) => (Number(b.id) || 0) - (Number(a.id) || 0);
}
// Schedule order is semantic, not id-based: ids are unreliable (most courses were
// synced in reverse, some partly forward — e.g. DA321's Unit 1 has the lowest id —
// and rows added in the app get new, higher ids). Lessons go in number order; each
// "Unit N" sits right before the first lesson whose `unit` column is N, falling back
// to the lesson that followed it in the legacy id-DESC order. Any other row
// (Midterm, Holiday, …) stays right after the row that preceded it in that order.
const _unitItemNum = (s) => { const m = /^\s*unit\s*(\d+)/i.exec(String(s || '')); return m ? parseInt(m[1], 10) : null; };
const _lessonItemNum = (s) => { const m = /^\s*(?:lesson|l)\s*(\d+)/i.exec(String(s || '')); return m ? parseInt(m[1], 10) : null; };
function sortScheduleRows(rows) {
  // Baseline = id order in whichever direction the lessons mostly run (legacy is DESC).
  const asc = [...rows].sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
  const ls = asc.map(r => _lessonItemNum(r.item)).filter(n => n !== null);
  let up = 0;
  for (let i = 1; i < ls.length; i++) up += Math.sign(ls[i] - ls[i - 1]);
  const base = up > 0 ? asc : asc.reverse();
  const firstLessonOfUnit = {};
  base.forEach(r => {
    const l = _lessonItemNum(r.item), u = parseInt(r.unit, 10);
    if (l !== null && !isNaN(u) && (firstLessonOfUnit[u] === undefined || l < firstLessonOfUnit[u])) firstLessonOfUnit[u] = l;
  });
  const keys = base.map(r => _lessonItemNum(r.item));
  base.forEach((r, i) => {
    const u = _unitItemNum(r.item);
    if (u === null) return;
    let next = firstLessonOfUnit[u];
    for (let j = i + 1; next === undefined && j < base.length; j++) next = _lessonItemNum(base[j].item) ?? undefined;
    if (next === undefined) next = u === 1 ? 0 : 1e9;
    keys[i] = next - 0.5;
  });
  let prev = -1;
  base.forEach((r, i) => { if (keys[i] === null) keys[i] = prev + 0.001; prev = keys[i]; });
  return base.map((r, i) => ({ r, k: keys[i], i })).sort((a, b) => a.k - b.k || a.i - b.i).map(x => x.r);
}
async function loadCourseDetailTab(offeringId, tabKey) {
  const spec = CP_DETAIL_TABLES[tabKey];
  if (!spec) return [];
  const cache = (courseDetailCache[offeringId] = courseDetailCache[offeringId] || {});
  if (cache[tabKey] === 'loading') {
    while (courseDetailCache[offeringId][tabKey] === 'loading') await new Promise(r => setTimeout(r, 40));
    return courseDetailCache[offeringId][tabKey];
  }
  if (cache[tabKey]) return cache[tabKey]; // already loaded (rows array or {error})
  cache[tabKey] = 'loading';
  try {
    const rows = await sbGet(spec.table, `offering_id=eq.${offeringId}&select=${spec.cols}&order=id.asc`);
    // DB row order is unreliable (the sync inserted child rows in different
    // orders per table), so re-sort into the intended order per tab:
    //  - readings/activities carry a "Lesson N" field → natural-sort by that
    //    number, then id (they group multiple rows per lesson).
    //  - schedule/assessment/communication have no clean lesson field but were
    //    inserted in reverse, so id DESCENDING restores their intended order.
    cache[tabKey] = !Array.isArray(rows) ? rows
      : tabKey === 'schedule' ? sortScheduleRows(rows)
      : rows.sort(detailRowSorter(tabKey));
  } catch (e) {
    cache[tabKey] = { error: e.message };
  }
  if (String(currentCourseId) === String(offeringId) && courseTab === tabKey) renderCoursePage();
  return cache[tabKey];
}

function renderCoursePage() {
  const c = findCourseById(currentCourseId);
  const el = document.getElementById('page-course');
  if (!c) {
    // Deep-linked to a course from the Course Finder before the catalog finished loading: fetch it,
    // loadFinderData re-renders this page.
    if (!catalogLoaded && !catalogError) {
      el.innerHTML = `<div class="cp-empty">Loading…</div>`;
      loadFinderData();
      return;
    }
    el.innerHTML = `
      <button class="cp-back" onclick="backToList()">${chevronSvg()} Back to ${courseOrigin().label}</button>
      <div class="cp-empty">This syllabus is not published.</div>`;
    return;
  }

  // Class meeting times back the Main tab and the Schedule tab's Class date column;
  // the class dates also need the academic calendar (holidays, breaks, make-up days).
  if ((courseTab === 'main' || courseTab === 'schedule') && !periodsCache[c.id]) loadPeriodsIfNeeded(c.id);
  if (courseTab === 'schedule' && !academicCalendar) {
    loadAcademicCalendar().then(() => { if (String(currentCourseId) === String(c.id) && courseTab === 'schedule') renderCoursePage(); });
  }

  let tabContent;
  if (courseTab === 'main') {
    tabContent = renderMainTab(c);
  } else if (courseTab === 'rubrics') {
    tabContent = renderRubricsTab(c);
  } else {
    const data = (courseDetailCache[c.id] || {})[courseTab];
    if (!data || data === 'loading') {
      tabContent = `<div class="cp-card"><div class="cp-empty">Loading…</div></div>`;
      loadCourseDetailTab(c.id, courseTab);
    } else if (data.error) {
      tabContent = `<div class="cp-card"><div class="cp-empty">Unable to load: ${esc(data.error)}</div></div>`;
    } else {
      tabContent = renderDetailTab(c, courseTab, data);
    }
  }

  const pdf = extractDriveId(c.ownSyllabusLink)
    ? `<a class="btn btn-primary" style="text-decoration:none;" href="${syllabusPdfUrl(c.ownSyllabusLink)}" target="_blank" rel="noopener">Download syllabus (PDF)</a>` : '';
  el.innerHTML = `
    <button class="cp-back" onclick="backToList()">${chevronSvg()} Back to ${courseOrigin().label}</button>
    <div class="cp-header">
      <div class="cp-title-row">
        <span class="chip-code">${esc(c.code)}</span>
        <div class="cp-actions">${pdf}</div>
      </div>
      <p class="cp-title">${esc(c.title)}</p>
      <p class="cp-meta">${esc(c.semester)} · ${creditsText(c.credits)} · ${esc(c.classification)}</p>
    </div>
    <div class="cp-tabs">
      ${CP_TABS.map(t => `<button class="cp-tab ${courseTab === t.key ? 'active' : ''}" onclick="setCourseTab('${t.key}')">${esc(t.label)}</button>`).join('')}
    </div>
    <div id="cp-tab-body">${tabContent}</div>
    ${cpTabNavHtml()}
  `;
}

// ── COURSE PAGE — TABS (read-only) ──
// Populates periodsCache[offeringId] (used directly for read-only display)
// and re-renders the page once loaded, same lazy-load pattern as the other
// tabs. Safe to call repeatedly — a no-op once cached.
async function loadPeriodsIfNeeded(offeringId) {
  if (periodsCache[offeringId]) return periodsCache[offeringId];
  try {
    // Needed before the periods are cached: a period that leaves its valid
    // range blank has it filled in from the cohort's academic calendar (see
    // fillDerivedPeriodRanges), so "Class meeting times" shows *when* each
    // meeting pattern applies instead of two identical-looking blank cards.
    await loadAcademicCalendar();
    const rows = await sbGet('course_schedule_periods', `offering_id=eq.${offeringId}&select=*&order=id.asc`);
    const c = findCourseById(offeringId);   // also a course the viewer does not teach (Finder, a student's course)
    const loaded = rows.map(r => {
      // A period stored with the app's own hardcoded fallback timezone
      // ('America/Los_Angeles', used both here and in newSchedulePeriod())
      // was very likely never actually chosen by a human — e.g. a row saved
      // back before weekday_time parsing existed. Prefer weekday_time's
      // timezone in that case too, not only when r.timezone is outright
      // null, so a stale "Pacific Time" default doesn't linger forever.
      let timezone = r.timezone || (c && c.classTimezone) || 'America/Los_Angeles';
      if (timezone === 'America/Los_Angeles' && c && c.classTimezone && c.classTimezone !== 'America/Los_Angeles') {
        timezone = c.classTimezone;
      }
      return {
        id: r.id, campusNote: r.campus_note || '', validFrom: r.valid_from || '', validTo: r.valid_to || '',
        days: { mon: !!r.mon, tue: !!r.tue, wed: !!r.wed, thu: !!r.thu, fri: !!r.fri, sat: !!r.sat, sun: !!r.sun },
        // No "09:00:00" fallback here on purpose — a genuinely-empty start_time
        // must stay blank, or the isBlank() check below can never detect a
        // placeholder row (see next comment).
        startTime: (r.start_time || '').slice(0, 5), durationMin: r.duration_min || DEFAULT_DURATION_MIN,
        timezone, extraZones: r.extra_timezones || [],
      };
    });
    // A saved period row with no class days and no start time is just an
    // empty placeholder (e.g. inserted by an earlier Save before this
    // offering's schedule was ever filled in) — prefer seeding fresh from
    // weekday_time (see mapCourse/parseWeekdayTime) over showing that blank
    // row, same as if no period had been saved at all.
    // A saved period with no class days is not a usable meeting pattern — even
    // when a stale start_time/duration lingers on it (e.g. a 09:00 / 75-min row
    // left by an earlier import). Treat "no class days" alone as a placeholder
    // and re-seed from weekday_time; otherwise the detail page shows that stale
    // row while the home card (which reads weekday_time) shows the real schedule.
    const isBlank = (p) => !Object.values(p.days).some(Boolean);
    const allBlank = loaded.length > 0 && loaded.every(isBlank);
    const hasWeekdayData = !!(c && c.scheduleDays.length && c.startTime);
    if (!loaded.length || (allBlank && hasWeekdayData)) {
      const seed = newSchedulePeriod();
      if (c) {
        FULL_DAY_ORDER.forEach(d => { seed.days[d.toLowerCase().slice(0, 3)] = c.scheduleDays.includes(d); });
        if (c.startTime) seed.startTime = c.startTime;
        if (c.classTimezone) seed.timezone = c.classTimezone;
      }
      // Keep the existing (blank) row's id/campusNote/validFrom/validTo if
      // there was one, so the next Save updates it in place instead of
      // inserting a duplicate period.
      if (allBlank) Object.assign(seed, { id: loaded[0].id, campusNote: loaded[0].campusNote, validFrom: loaded[0].validFrom, validTo: loaded[0].validTo });
      const seeds = [seed];
      // course_offerings.second_weekday_time ("Mon./Wed. 21:00 Eastern
      // Time") describes a second weekly meeting pattern — e.g. a lecture
      // slot plus a lab slot — that's separate from weekday_time. When
      // there's no saved schedule yet, seed a second Period for it too, so
      // both show up right away instead of the professor having to notice
      // it's missing and add it by hand.
      if (c && c.secondScheduleDays.length && c.secondStartTime) {
        const seed2 = newSchedulePeriod();
        FULL_DAY_ORDER.forEach(d => { seed2.days[d.toLowerCase().slice(0, 3)] = c.secondScheduleDays.includes(d); });
        seed2.startTime = c.secondStartTime;
        if (c.secondClassTimezone) seed2.timezone = c.secondClassTimezone;
        // Reuse Period 1's valid dates so the professor isn't left re-typing
        // the same semester date range for the second meeting pattern.
        seed2.validFrom = seed.validFrom;
        seed2.validTo = seed.validTo;
        if (loaded.length > 1 && isBlank(loaded[1])) {
          Object.assign(seed2, { id: loaded[1].id, campusNote: loaded[1].campusNote });
        }
        seeds.push(seed2);
      }
      periodsCache[offeringId] = seeds;
    } else {
      periodsCache[offeringId] = loaded;
    }
  } catch (e) {
    periodsCache[offeringId] = [];
    showToast('Could not load schedule periods: ' + e.message);
  }
  fillDerivedPeriodRanges(offeringId);
  if (String(currentCourseId) === String(offeringId)) {
    if (courseTab === 'main' || courseTab === 'schedule') renderCoursePage();
  }
  return periodsCache[offeringId];
}

// Writes the academic calendar's dates into any period that left its valid
// range blank, so "Class meeting times" on the Main tab shows the stretch each
// pattern covers -- Mon/Wed 21:00 Eastern from Mar 2 to May 24, then Tue/Thu
// 20:00 Korea from May 25 to Jun 26, for a Spring 2026 1st-2nd-Cohort course.
// Only blanks are touched: a range the professor typed always wins, and the
// derived dates are ordinary editable values, saved like any other on Save.
function fillDerivedPeriodRanges(offeringId) {
  const periods = periodsCache[offeringId];
  if (!periods || !periods.length) return;
  const course = findCourseById(offeringId);
  const term = academicTermFor(course);
  if (!term) {
    // Blank valid dates almost always mean the offering couldn't be matched to
    // a published calendar — say which lookup failed instead of leaving the
    // professor staring at two empty date fields.
    const want = course ? parseSemesterLabel(course.semester) : {};
    console.warn(
      '[TaeSylla] No academic calendar matched — Valid dates left blank.',
      { code: course && course.code, semesterLabel: course && course.semester,
        parsed: want, cohortGuess: course && cohortForCourseCode(course.code),
        calendarLoaded: !!academicCalendar,
        termsInDb: academicCalendar ? academicCalendar.terms.map(t => `${t.year} ${t.semester} / ${t.cohort}`) : null }
    );
    return;
  }
  const events = (academicCalendar && academicCalendar.eventsByTerm[term.id]) || [];
  periods.forEach((p) => {
    if (p.validFrom && p.validTo) return;
    const { from, to } = periodRange(p, term, events);
    if (!p.validFrom) p.validFrom = from;
    if (!p.validTo)   p.validTo   = to;
  });
  console.log('[TaeSylla] Valid dates from calendar:', `${term.year} ${term.semester} / ${term.cohort}`,
    periods.map(p => `${Object.keys(p.days).filter(k => p.days[k]).join('/')} ${p.timezone}: ${p.validFrom} → ${p.validTo}`));
}

// Each meeting pattern: days and time in the class's time zone, and in the viewer's own when that differs.
function periodsListHtml(periods) {
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const cards = periods.map((p, i) => {
    const days = FULL_DAY_ORDER.filter(d => p.days[d.toLowerCase().slice(0, 3)]);
    if (!days.length || !p.startTime) return '';
    const at = tz => days.map(d => {
      const r = convertDayToZone(d, p.startTime, p.durationMin, p.validFrom, p.timezone, tz);
      return `${r.weekday} ${r.startTime}–${r.endTime}${r.dayShift > 0 ? ' (+1 day)' : r.dayShift < 0 ? ' (-1 day)' : ''}`;
    }).join(', ') + ` ${tzLabel(tz)}`;
    const dates = (p.validFrom || p.validTo) ? `${formatMMDDYYYY(p.validFrom) || '…'} – ${formatMMDDYYYY(p.validTo) || '…'}` : '';
    return `
      <div class="cp-period-card">
        ${periods.length > 1 ? `<span class="cp-period-badge">Period ${i + 1}</span>` : ''}
        <div class="cp-field-grid" style="margin-top:${periods.length > 1 ? 12 : 0}px;">
          ${cpField('Class time', at(p.timezone))}
          ${p.timezone !== myTz ? cpField('In your time zone', at(myTz)) : ''}
          ${dates ? cpField('Dates', dates) : ''}
          ${p.campusNote ? cpField('Student location', p.campusNote) : ''}
        </div>
      </div>`;
  }).join('');
  return cards || '<div class="cp-empty">Not added yet.</div>';
}

// Assessment, Communication, Schedule, Readings: a plain table. Schedule adds each lesson's class date.
function renderDetailTab(c, tabKey, rows) {
  const cols = CP_DETAIL_TABLES[tabKey].columns;
  const cell = (v, field) => {
    const t = String(v ?? '').trim();
    if (field === 'url_link' && /^https?:\/\//i.test(t)) return `<a href="${esc(t)}" target="_blank" rel="noopener" style="color:var(--blue);word-break:break-all;">${esc(t)}</a>`;
    return `<span style="white-space:pre-wrap;">${esc(t)}</span>`;
  };
  const head = cols.map(col => col.label);
  const body = rows.map(r => cols.map(col => cell(r[col.field], col.field)));
  let note = '';
  if (tabKey === 'schedule') {
    // Rows whose Item starts with "Lesson N" take the Nth class date, in order.
    const dates = computeClassDatesForOffering(c.id);
    let n = 0;
    head.push('Class date');
    rows.forEach((r, i) => {
      const isLesson = /^(lesson|l)\s*\d+/i.test(String(r.item || '').trim());
      const eff = isLesson ? effectiveLessonDate(r, dates[n++] || null, c.id) : null;
      body[i].push(eff ? esc(formatClassDateLabel(eff)) : '');

  }
  if (tabKey === 'assessment' && rows.length) {
    const total = rows.reduce((sum, r) => sum + (Number(r.ratio_pct) || 0), 0);
    note = `<p style="margin-top:14px;font-size:18px;color:var(--text3);">Total: ${total}%</p>`;

// ── RUBRICS TAB: the rubric of each assessment item (criteria, points, level descriptions) ──
let rubricCache = {};       // { [offeringId]: {status, error, rubrics:[{item, scope, programId, groups, criteria}]} }
let rbSel = null;           // selected assessment item
const RB_LV = [['4', 'Exemplary'], ['3', 'Proficient'], ['2', 'Developing'], ['1', 'Needs Improvement']];
const RB_LK = ['E', 'P', 'D', 'NI'];
const rbAnyPts = cs => cs.some(x => x.pts !== null && x.pts !== undefined);
const rbSum = cs => cs.reduce((a, x) => a + (x.pts === null || x.pts === undefined ? 0 : Number(x.pts)), 0);

async function loadRubrics(c) {
  const id = c.id;
  if (rubricCache[id] && rubricCache[id].status !== 'error') return rubricCache[id];
  rubricCache[id] = { status: 'loading' };
  try {
    const rs = await sbGet('outcome_rubrics', `offering_id=eq.${id}&select=rubric_id,assessment_item,default_scope,uses_program_rubric_id&order=rubric_id.asc`);
    // An item that uses a program rubric (e.g. Learning Journaling) shows that rubric's criteria.
    const ids = [...new Set(rs.map(r => r.uses_program_rubric_id || r.rubric_id))];
    const [groups, crits] = ids.length ? await Promise.all([
      sbGet('outcome_rubric_groups', `rubric_id=in.(${ids.join(',')})&select=rubric_id,group_key,name,sort_order&order=sort_order.asc`),
      sbGet('outcome_rubric_criteria', `rubric_id=in.(${ids.join(',')})&select=rubric_id,group_key,sort_order,name,points,descriptors&order=sort_order.asc`),
    ]) : [[], []];
    rubricCache[id] = {
      status: 'ready',
      rubrics: rs.map(r => {
        const src = r.uses_program_rubric_id || r.rubric_id;
        return {
          item: r.assessment_item, scope: r.default_scope, program: !!r.uses_program_rubric_id,
          groups: groups.filter(g => g.rubric_id === src).map(g => ({ key: g.group_key, name: g.name })),
          criteria: crits.filter(x => x.rubric_id === src).map(x => ({
            g: x.group_key, name: x.name, pts: x.points === null ? null : Number(x.points),
            lv: RB_LK.map(k => (x.descriptors || {})[k] || ''),
          })),
        };
      }),
    };
  } catch (e) {
    rubricCache[id] = { status: 'error', error: e.message };
  }
  if (String(currentCourseId) === String(id)) renderCoursePage();
  return rubricCache[id];
}

function renderRubricsTab(c) {
  const rc = rubricCache[c.id];
  const loading = `<div class="cp-card"><div class="cp-empty">Loading…</div></div>`;
  if (!rc || rc.status === 'loading') { if (!rc) loadRubrics(c); return loading; }
  if (rc.status === 'error') return `<div class="cp-card"><div class="cp-empty">Unable to load: ${esc(rc.error)}</div></div>`;
  const saved = (courseDetailCache[c.id] || {}).assessment;
  if (!Array.isArray(saved)) {
    loadCourseDetailTab(c.id, 'assessment').then(() => { if (courseTab === 'rubrics' && String(currentCourseId) === String(c.id)) renderCoursePage(); });
    return loading;
  }
  const rows = saved.filter(r => String(r.item || '').trim());
  if (!rows.length) return `<div class="cp-card"><div class="cp-empty">Not added yet.</div></div>`;
  const rubricOf = item => rc.rubrics.find(r => String(r.item || '').trim() === String(item || '').trim() && r.criteria.length);
  if (!rows.some(r => r.item === rbSel)) rbSel = (rows.find(r => rubricOf(r.item)) || rows[0]).item;
  const pills = rows.map(r => `<button class="rb-pt ${rbSel === r.item ? 'on' : ''}" onclick="rbSel=${esc(JSON.stringify(r.item)).replace(/"/g, '&quot;')};renderCoursePage()">${esc(r.item)} <span class="rb-pt-pct">${r.ratio_pct ?? ''}${r.ratio_pct !== null && r.ratio_pct !== '' ? '%' : ''}</span>${rubricOf(r.item) ? '' : '<span class="rb-pt-st">no rubric</span>'}</button>`).join('');
  const row = rows.find(r => r.item === rbSel);
  const r = rubricOf(rbSel);
  const body = r ? rbTableHtml(row, r)
    : `<div class="cp-card"><div class="rb-empty quiet"><div class="rb-empty-h">No rubric for ${esc(row.item)}</div></div></div>`;
  return `<span class="cp-label">Assessment item</span><div class="rb-pts">${pills}</div>${body}`;
}

function rbTableHtml(row, r) {
  const hasPts = rbAnyPts(r.criteria);
  let h = `<div class="cp-card"><div class="rb-head"><div><div class="cp-card-title" style="margin-bottom:4px">${esc(row.item)}</div>
      <div class="rb-sum">${row.ratio_pct ?? ''}${row.ratio_pct !== null && row.ratio_pct !== '' ? '% &middot; ' : ''}${esc(r.scope || '')}${hasPts ? ` &middot; ${rbSum(r.criteria)} points` : ''}${r.program ? ' &middot; program rubric' : ''}</div></div></div>
    <div class="rb-wrap"><table class="rb-grid"><colgroup><col style="width:22%"><col style="width:62px">${RB_LV.map(() => '<col>').join('')}</colgroup>
    <thead><tr><th>Criterion</th><th class="num">Pts</th>${RB_LV.map(([n, t]) => `<th class="rb-lvh l${n}"><span>${n}</span>${t}</th>`).join('')}</tr></thead><tbody>`;
  const groups = r.groups.length ? r.groups : [{ key: null, name: null }];
  for (const g of groups) {
    const cs = r.criteria.filter(x => (r.groups.length ? x.g === g.key : true));
    if (g.key) h += `<tr class="rb-grp"><td colspan="${2 + RB_LV.length}"><span class="rb-gk">${esc(g.key)}</span><b>${esc(g.name)}</b>${rbAnyPts(cs) ? `<span class="rb-gsub">${rbSum(cs)} pts</span>` : ''}</td></tr>`;
    for (const x of cs) {
      h += `<tr class="rb-row"><td><b class="rb-cname">${esc(x.name)}</b></td>
        <td class="num">${x.pts ?? '<span class="rb-none">–</span>'}</td>
        ${x.lv.map(t => `<td class="rb-lv">${t ? esc(t) : ''}</td>`).join('')}</tr>`;
    }
  }
  return h + '</tbody></table></div></div>';
}

function sbHeaders(extra = {}) {
  if (!supabaseUser?.access_token) throw new Error('Not authenticated');
  return {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${supabaseUser.access_token}`,
    'Content-Type': 'application/json',
    Prefer: 'return=representation',
    ...extra,
  };
}
async function sbGet(table, params = '') {
  await sbFresh();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: sbHeaders() });
  if (r.status === 401) { showToast('Session expired. Please sign in again.'); handleSignOut(); throw new Error('Session expired'); }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.message || body.hint || `HTTP ${r.status}`);
  }
  return r.json();
}

// ── AUTH ──
// ── SESSION (same as Telos) ──
// sessionStorage, not localStorage: a refresh keeps you signed in, closing the tab does not.
const SESSION_KEY = 'taesylla_session';
// Paideia: the suite apps share this origin, so each also keeps the session under one shared key.
// Signing in once (on the Paideia page or in any app) carries over to the others in the same tab,
// and signing out of one signs out of all of them.
const SUITE_KEY = 'paideia_session';
const SUITE_KEYS = ['paideia_session', 'telos_faculty_session', 'telos_student_session', 'taesylla_session', 'ergon_session', 'paideia_gcal'];
let freshSignIn = false;   // true only right after the password sign-in (then the app opens on Home)
// Tabs opened from Paideia start with a copy of one session. Supabase rotates the refresh token on every renewal,
// so a tab hands each renewed session to the other suite tabs (same origin), and takes a newer one for the same
// person from them. Without this, the next tab to renew would be refused and the session revoked.
var SUITE_CH = 'BroadcastChannel' in window ? new BroadcastChannel('paideia_suite') : null;
function saveAuthSession(quiet) {
  try { const v = JSON.stringify(supabaseUser); sessionStorage.setItem(SESSION_KEY, v); sessionStorage.setItem(SUITE_KEY, v); } catch (e) {}
  if (!quiet && SUITE_CH && supabaseUser) SUITE_CH.postMessage({ session: supabaseUser });
}
if (SUITE_CH) SUITE_CH.onmessage = e => {
  const s = e.data && e.data.session, me = supabaseUser && supabaseUser.user && supabaseUser.user.email;
  if (!s || !s.access_token || !me || !s.user || s.user.email !== me || (s.expires_at || 0) <= (supabaseUser.expires_at || 0)) return;
  supabaseUser = s; saveAuthSession(true);
};
function clearSession() { try { SUITE_KEYS.forEach(k => sessionStorage.removeItem(k)); } catch (e) {} }
// The newer of this app's own session and the shared one: a token renewed in another app wins.
function newestSession() {
  return [SESSION_KEY, SUITE_KEY].map(k => { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } })
    .filter(x => x && x.access_token).sort((a, b) => (b.expires_at || 0) - (a.expires_at || 0))[0] || null;
}
// Access tokens last about an hour: renew with the refresh token when one is nearly out.
// Several requests at once share one renewal (Supabase rotates the refresh token).
let sbRefreshing = null;
async function sbFresh() {
  const u = supabaseUser;
  if (!u?.access_token) return false;
  if (u.expires_at && u.expires_at * 1000 - Date.now() > 60000) return true;
  if (!u.refresh_token) return false;
  if (!sbRefreshing) sbRefreshing = (async () => {
    try {
      const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: u.refresh_token }) });
      if (!r.ok) throw new Error('refresh failed');
      supabaseUser = await r.json(); saveAuthSession(); return true;
    } catch (e) { console.warn('token refresh failed:', e.message); return false; }
    finally { sbRefreshing = null; }
  })();
  return sbRefreshing;
}
async function restoreSession() {
  const saved = newestSession();
  if (!saved?.access_token) return false;
  supabaseUser = saved; saveAuthSession();
  if (!(await sbFresh())) { supabaseUser = null; clearSession(); return false; }
  return true;
}

// After sign-in, or after a refresh that restored the session: the student, top bar, data.
async function enterApp(email, restored) {
  const authEmail = String((supabaseUser.user && supabaseUser.user.email) || email).trim().toLowerCase();
  const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${supabaseUser.access_token}` };

  const stData = stRes.ok ? await stRes.json() : [];

      const facRes = await fetch(`${SUPABASE_URL}/rest/v1/faculty_profiles?email=eq.${encodeURIComponent(authEmail)}&select=email`, { headers }).catch(() => null);
      const fac = facRes && facRes.ok ? await facRes.json() : [];

  STUDENT = preview || { id: String(stData[0].id), name: stData[0].name_en || authEmail.split('@')[0], email: authEmail };

async function handleWallLogin() {
  const email = document.getElementById('wall-email').value.trim();
  const password = document.getElementById('wall-password').value;
  const errEl = document.getElementById('wall-error');
  const btn = document.getElementById('wall-submit');
  if (loginLocked) return;

  if (!email || !password) { errEl.textContent = 'Email and password are required.'; return; }
  if (!email.endsWith('@taejae.ac.kr')) { errEl.textContent = 'Please use your @taejae.ac.kr institutional email.'; return; }
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') { errEl.textContent = 'Supabase is not configured yet — see the setup banner.'; return; }

  btn.textContent = 'Signing in…'; btn.disabled = true; errEl.textContent = '';

  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    supabaseUser = data;
    saveAuthSession();
    freshSignIn = true;
    await enterApp(email, false);
  } catch (e) {
    loginAttempts++;
    if (loginAttempts >= 5) {
      loginLocked = true;
      errEl.textContent = 'Too many failed attempts. Please wait 30 seconds.';
      btn.disabled = true;
      setTimeout(() => { loginAttempts = 0; loginLocked = false; btn.disabled = false; btn.textContent = 'Sign in'; errEl.textContent = ''; }, 30000);
    } else {
      errEl.textContent = e.message;
      btn.textContent = 'Sign in'; btn.disabled = false;
    }
  }
}

// ── DATA ──
// PostgREST embeds the linked `courses` catalog row automatically via the
// course_offerings.course_base_id -> courses.course_id foreign key.
// IMPORTANT: if `courses` has row-level security enabled with no SELECT
// policy for authenticated users, this embed silently comes back as null
// for every row (no error) — that's the #1 cause of "title/credits missing"
// even though the offering itself loaded fine. See supabase-courses-schema.sql.

// PostgREST normally returns real JSON booleans for boolean columns, but if
// mon..sun ever come back as text ('true'/'false'/'t'/'f') or 0/1, a plain
// truthy check on the string "false" would wrongly count as "on" (non-empty
// string). Coerce explicitly instead of trusting JS truthiness.
function truthyFlag(v) {
  if (v === true || v === 1) return true;
  if (v === false || v === null || v === undefined || v === 0) return false;
  const s = String(v).trim().toLowerCase();
  return s === 'true' || s === 't' || s === '1' || s === 'yes' || s === 'y';
}
function daysFromBooleans(r) {
  return [
    ['Mon', r.mon], ['Tue', r.tue], ['Wed', r.wed], ['Thu', r.thu], ['Fri', r.fri],
    ['Sat', r.sat], ['Sun', r.sun],
  ].filter(([, on]) => truthyFlag(on)).map(([label]) => label);
}

const COMPETENCY_COLS = [
  ['competency_critical_thinking', 'Critical Thinking'],

  ['competency_self_directed_learning', 'Self-directed Learning'],

//       1 -> Year 1,  2 -> Year 2,  3 or 4 -> Year 3-4
// Older semesters label the same populations by cohort ("3rd Cohort") rather
// than by year, so COHORT_ALIASES bridges the two naming schemes.
function cohortForCourseCode(code) {
  const s = String(code || '').toUpperCase();
  if (s.includes('IF')) return 'Year 1';
  const m = s.match(/\d/);
  if (!m) return null;
  const level = Number(m[0]);
  if (level <= 1) return 'Year 1';
  if (level === 2) return 'Year 2';
  if (level === 3 || level === 4) return 'Year 3-4';

  if (!inTerm.length) return null;

  const names = COHORT_ALIASES[cohort] || (cohort ? [cohort] : []);

// concurrent. Spring 2026 (1st & 2nd Cohort) is the case in point: students sit
// in New York until the one-week return-home suspension (May 18-22), then
// classes resume in Korea on May 25. The same course meets Mon/Wed 21:00
// Eastern for the first stretch and Tue/Thu 20:00 Korea for the rest.
//
// An explicit valid_from/valid_to on the period always wins. Otherwise the
// range comes from the academic calendar: a `timezone_switch` event marks the
// day the term changes timezone, and each period is assigned to the stretch
// written in its own timezone. With no such event, every period runs the whole

  const sw = timezoneSwitchOf(events);
  if (!sw || !p.timezone) return { from: term.start_date, to: term.end_date };

// match the period's weekdays, then applies the cohort's academic calendar:
//
//   class dates = weekday pattern - holidays - breaks + make-up days
//
// The make-up term is what the old hardcoded-breaks version missed. A make-up
// day *moves a weekday*: Chuseok falls on Thu Sept 24, so Thursday's classes
// meet on Fri Oct 2 instead -- a Friday-only course does NOT meet twice that
// day. academic_events.makes_up_for holds the date being made up, and only
// periods active on that date's weekday pick the make-up day up.

    const activeKeys = Object.keys(p.days).filter((k) => p.days[k]);

    // Thursday class can land on a Friday) and regardless of the term's end

    // They must still fall inside this period's own stretch -- a make-up held
    // while the cohort is still in New York belongs to the Mon/Wed pattern.
    makeups.forEach((mu) => {
      if (!activeKeys.includes(dayKeyOf(mu.makes_up_for))) return;
      const tail = (term && term.end_date > to) ? term.end_date : to;
      if (mu.start_date < from || mu.start_date > addDaysIso(tail, 14)) return;

function parseClassTime(text) {
  if (!text) return { start: '', end: '' };
  const s = String(text).trim();
  const to24 = (h, mm, ap) => {
    h = parseInt(h, 10);
    if (ap) { ap = ap.toLowerCase(); if (ap === 'pm' && h !== 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
    return `${String(h).padStart(2, '0')}:${mm}`;
  };
  // Range: "10:00-11:30", "10:00:00 - 11:30:00", "10:00 AM-11:30 AM", etc.
  // Seconds on either side (the ":00" a Postgres `time` value serializes
  // with) are optional and ignored so a range with seconds still matches.
  const range = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?\s*(?:-|–|—|~|to)\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i);
  if (range) return { start: to24(range[1], range[2], range[3]), end: to24(range[4], range[5], range[6] || range[3]) };

  // value ("10:00:00") with no separate end time in this table. Use it as
  // the start time; there's no range to derive an end time from.
  const single = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
  if (single) return { start: to24(single[1], single[2], single[3]), end: '' };
  return { start: '', end: '' };
}

// weekday_time is the authoritative schedule field on course_offerings — a
// single free-text string carrying days, start time, AND a human timezone
// name together, e.g. "Mon./Wed. 21:00 Eastern Time". Parse all three out of
// it; the separate mon..sun booleans + class_time are kept only as a
// fallback for rows that don't have weekday_time populated.
function parseWeekdayTime(text) {
  const out = { days: [], startTime: '', endTime: '', timezone: '' };
  if (!text) return out;
  const s = String(text).trim();

  const dayMap = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
  const dayRegex = /\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?/gi;
  let dm;
  while ((dm = dayRegex.exec(s)) !== null) {
    const d = dayMap[dm[1].toLowerCase()];
    if (d && !out.days.includes(d)) out.days.push(d);
  }

  const to24 = (h, mm, ap) => {
    h = parseInt(h, 10);
    if (ap) { ap = ap.toLowerCase(); if (ap === 'pm' && h !== 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
    return `${String(h).padStart(2, '0')}:${mm}`;
  };
  // Range first ("21:00-22:15"); falls back to a single time ("21:00") since
  // this field is often just a start time with no explicit end.
  const range = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?\s*(?:-|–|—|~|to)\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i);
  if (range) {
    out.startTime = to24(range[1], range[2], range[3]);
    out.endTime = to24(range[4], range[5], range[6] || range[3]);
  } else {
    const single = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i);
    if (single) out.startTime = to24(single[1], single[2], single[3]);
  }

  // Match against the app's own TIMEZONE_OPTIONS labels ("Eastern Time",
  // "Pacific Time", "Korea Time", ...) — longest label first so e.g. a
  // hypothetical "Time" substring never shadows a real, longer label.
  const sortedTz = [...TIMEZONE_OPTIONS].sort((a, b) => b.label.length - a.label.length);
  for (const t of sortedTz) {
    if (s.toLowerCase().includes(t.label.toLowerCase())) { out.timezone = t.iana; break; }
  }
  return out;
}

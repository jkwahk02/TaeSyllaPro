  const boolDays = daysFromBooleans(r);
  const { start: classStart, end: classEnd } = parseClassTime(classTime);
  const days = wd.days.length ? wd.days : boolDays;
  const startTime = wd.startTime || (isPlaceholderTime(classStart) ? '' : classStart);
  // No explicit end/duration in weekday_time or class_time — assume the
  // default 100-minute class length rather than leaving endTime blank.
  const endTime = wd.endTime || classEnd || (startTime ? addMinutesToTimeStr(startTime, DEFAULT_DURATION_MIN) : '');
  const classTimezone = wd.timezone || '';
  // second_weekday_time is the same "Mon./Wed. 21:00 Eastern Time" format,
  // for a course with two separate weekly meeting patterns (e.g. a lecture
  // slot plus a lab slot). Parsed the same way as weekday_time — see
  // loadPeriodsIfNeeded, which seeds a second schedule period from this when
  // present and no periods have been saved for the course yet.
  const secondWeekdayTime = isPlaceholderTime(r.second_weekday_time) ? '' : r.second_weekday_time;
  const wd2 = parseWeekdayTime(secondWeekdayTime);
  const secondScheduleDays = wd2.days;
  const secondStartTime = wd2.startTime;
  const secondEndTime = wd2.endTime || (secondStartTime ? addMinutesToTimeStr(secondStartTime, DEFAULT_DURATION_MIN) : '');
  const secondClassTimezone = wd2.timezone || '';
  // `courses.competency_*` stores a 0–1 fraction (e.g. 0.1 = 10%), not a
  // whole percentage — convert to a 0–100 display value here, and back to a
  // fraction on save (see saveMainEdits).
  // Each catalog field defaults to (inherits) the base course value, but the
  // offering may override it — the offering's own column wins when it is set
  // (non-null / non-empty), otherwise we fall back to the base course.
  const ovT = (col) => { const v = r[col]; return (v === null || v === undefined || v === '') ? catalog[col] : v; };
  const ovN = (col) => (r[col] ?? catalog[col]);
  const competenciesRaw = COMPETENCY_COLS.map(([col, label]) => {
    const cv = ovN(col);
    return { col, label, pct: cv != null ? Math.round(Number(cv) * 100) : 0 };
  });
  const competencies = competenciesRaw.filter(c => c.pct > 0);
  return {
    id: r.offering_id,
    courseBaseId: r.course_base_id,
    code: fullCode,
    section: r.section || null,
    courseBaseId: r.course_base_id || null,
    // Prefer a section-specific title stored on the offering (e.g. DA200-1 vs
    // DA200-2); fall back to the base course's catalog title.
    title: ovT('title') || (catalogMissing ? '(catalog data unavailable — check RLS)' : '(untitled)'),
    credits: ovN('credits') ?? null,
    classification: ovT('classification') || '—',
    semester: r.semester_year || [r.semester, r.year].filter(Boolean).join(' '),
    scheduleDays: days,
    scheduleDisplay: weekdayTime || (days.length ? `${days.join('/')} ${classTime}`.trim() : ''),
    startTime,
    endTime,
    classTimezone,
    secondScheduleDays,
    secondStartTime,
    secondEndTime,
    secondClassTimezone,
    status: r.status === 'published' ? 'published' : 'draft',
    officeHours: r.office_hours || '',
    // Unassigned offerings must NOT inherit the signed-in user's name (that made
    // every professor-less course in the Course Finder read as the viewer). Show
    // an explicit "TBD" placeholder instead.
    professor: r.professor || 'TBD',
    professorEmail: r.professor_email || '',
    // Prefer the catalog's single lead_program (one clean value, one of the 5
    // programs). The offering's own `program` column is a combined "A, B, C"
    // string for cross-listed courses, so only fall back to its FIRST entry.
    program: String(catalog.lead_program || '').trim() || String(ovT('program') || '').split(',')[0].trim(),
    // Cross-listed programs live on the catalog (courses.cross_listed_programs),
    // stored as a comma-separated string — parse into a clean array for display.
    crossListed: String(catalog.cross_listed_programs || '').split(',').map(s => s.trim()).filter(Boolean),
    description: ovT('description') || '',
    prerequisites: ovT('prerequisites') || '',
    learningObjectives: ovT('learning_objectives') || '',
    requiredText: ovT('required_text') || '',
    category: ovT('category') || '',
    shortDescription: ovT('short_description') || '',
    syllabusLink: ovT('syllabus_link') || '',
    // The offering's OWN generated syllabus (no catalog fallback). The Syllabus
    // document card keys off this so an offering that hasn't generated its own
    // shows the empty/create state instead of inheriting the base course's doc.
    ownSyllabusLink: r.syllabus_link || '',
    newCurriculum: (r.new_curriculum ?? catalog.new_curriculum) !== false,
    competencies,
    competenciesRaw,
  };
}

// Columns every offering list reads (Home, Course Finder, a student's courses).
const OFFERING_SELECT =
  `offering_id,course_id,course_base_id,section,semester,year,semester_year,` +
  `mon,tue,wed,thu,fri,sat,sun,class_time,weekday_time,second_weekday_time,office_hours,status,professor,professor_email,` +
  // Per-offering override columns (inherit from courses when null). See mapCourse ovT/ovN.
  `title,description,prerequisites,learning_objectives,required_text,classification,credits,category,short_description,syllabus_link,new_curriculum,program,` +
  `competency_critical_thinking,competency_creative_thinking,competency_self_directed_learning,competency_communication,competency_diversity_empathy,competency_global_harmony,` +
  `courses(code,title,credits,classification,description,prerequisites,program,lead_program,cross_listed_programs,` +
  `competency_critical_thinking,competency_creative_thinking,competency_self_directed_learning,` +
  `competency_communication,competency_diversity_empathy,competency_global_harmony,` +
  `learning_objectives,required_text,category,short_description,syllabus_link,new_curriculum)`;


// Term codes in student_course_history: 'YYYY-1' = Fall YYYY, 'YYYY-2' = Spring YYYY+1 (the academic
// year starts in the fall, as in ergon_term_code). A Telos plan term may already read 'Fall 2027'.
function termToSemester(t) {
  const s = String(t || '').trim();
  const m = /^(\d{4})-([12])$/.exec(s);
  if (m) return m[2] === '1' ? `Fall ${m[1]}` : `Spring ${Number(m[1]) + 1}`;
  return /^(Fall|Spring) \d{4}$/.test(s) ? s : '';
}
const baseCourseId = id => String(id || '').replace(/-\d+$/, '');
const sectionKey = s => { const v = String(s ?? '').trim(); return v ? v.padStart(2, '0') : '01'; };

// A student's Home: courses taken or being taken (student_course_history, as in ergon_v_class_roster),
// plus courses planned in Telos and not taken yet (student_requirement_courses). A course opens its
// offering's published syllabus; one with no published offering is listed without a syllabus.
async function loadStudentData() {
  try {
    const sid = encodeURIComponent(STUDENT.id);
    const [hist, plan] = await Promise.all([
      sbGet('student_course_history', `student_id=eq.${sid}&source=in.(registered,graded)&select=term,course_id,section`),
      sbGet('student_requirement_courses', `student_id=eq.${sid}&is_completed=eq.false&select=course_id,term`).catch(() => []),
    ]);
    const ids = [...new Set([...hist.map(h => h.course_id), ...hist.map(h => baseCourseId(h.course_id)), ...plan.map(p => p.course_id)].filter(Boolean))];
    const inList = ids.map(i => `"${String(i).replace(/"/g, '')}"`).join(',');
    const [offRows, catRows] = ids.length ? await Promise.all([
      // status filter as well as RLS: a faculty account previewing this app can read drafts too
      sbGet(TBL_OFFERINGS, `or=${encodeURIComponent(`(course_id.in.(${inList}),course_base_id.in.(${inList}))`)}&status=eq.published&select=${OFFERING_SELECT}`),
      sbGet('courses', `course_id=in.${encodeURIComponent(`(${inList})`)}&select=course_id,title,credits,classification`).catch(() => []),
    ]) : [[], []];
    const offerings = offRows.map(r => Object.assign(mapCourse(r), { offeringCourseId: r.course_id, sectionKey: sectionKey(r.section) }));
    const catalog = {};
    catRows.forEach(x => { catalog[x.course_id] = x; });
    // The offering a student took: same term and course, the same section when there are several.
    const findOffering = (courseId, semester, section) => {
      const base = baseCourseId(courseId);
      const cands = offerings.filter(o => o.semester === semester && (o.offeringCourseId === courseId || o.courseBaseId === courseId || o.courseBaseId === base));
      return cands.find(o => !section || o.sectionKey === section) || (cands.length === 1 ? cands[0] : null);
    };
    let n = 0;
    const noSyllabus = (courseId, semester) => {
      const cat = catalog[courseId] || catalog[baseCourseId(courseId)] || {};
      return { id: `none-${++n}`, noSyllabus: true, code: courseId, title: cat.title || courseId, semester,
        credits: cat.credits ?? null, classification: cat.classification || '—', status: '', professor: '', program: '', crossListed: [], scheduleDays: [] };
    };
    const list = [], seen = new Set(), taken = new Set();
    hist.forEach(h => {
      const semester = termToSemester(h.term);
      taken.add(baseCourseId(h.course_id));
      const o = findOffering(h.course_id, semester, sectionKey(h.section));
      const key = o ? `o${o.id}` : `h${h.course_id}|${semester}`;
      if (seen.has(key)) return;
      seen.add(key);
      list.push(o || noSyllabus(h.course_id, semester));
    });
    // Planned and not taken yet: only a term still to come, or no term chosen.
    plan.forEach(p => {
      const semester = termToSemester(p.term);
      if (taken.has(baseCourseId(p.course_id)) || (semester && semesterSortKey(semester) <= CURRENT_KEY)) return;
      const o = semester ? findOffering(p.course_id, semester) : null;
      const key = o ? `o${o.id}` : `p${baseCourseId(p.course_id)}|${semester}`;
      if (seen.has(key)) return;
      seen.add(key);
      list.push(Object.assign(o ? { ...o } : noSyllabus(p.course_id, semester), { upcoming: true, planned: true }));
    });
    studentCourses = list;
    console.log(`[TaeSylla] Student ${STUDENT.id}: ${hist.length} enrolment row(s), ${plan.length} planned, ${offerings.length} published offering(s).`);
    if (!dataLoaded && freshSignIn && location.hash) history.replaceState(null, '', location.pathname + location.search);
    dataLoaded = true;
    renderHome();
    handleRoute();
  } catch (e) {
    document.getElementById('page-home').innerHTML =
      `<div style="padding:18px;background:var(--red-l);color:var(--red);border-radius:var(--r-lg);font-size:18px;"><strong>Unable to load your courses.</strong> ${esc(e.message)}</div>`;
  }
}

// ── COURSE FINDER (full catalog: every program, professor, semester) ──
// Reuses Home's course card / list row so the two views stay identical; the
// only behavioural difference is that "Back" returns here (see backToList).
// Pages a course can be opened FROM. The course page's "Back" button names and
// returns to whichever one the user came from, and that page's rail icon stays
// active. To add another such page later (e.g. a Dashboard that lists courses),
// add ONE entry here and set `lastListRoute` in that route's branch — the back
// label, back navigation, and active rail all follow automatically.
const COURSE_ORIGINS = {
  home:   { hash: '',       label: 'Home',          rail: 'rail-home' },
  finder: { hash: 'finder', label: 'Course Finder', rail: 'rail-finder' },
};
let lastListRoute = 'home';
function courseOrigin() { return COURSE_ORIGINS[lastListRoute] || COURSE_ORIGINS.home; }
let catalogCourses = [];                // all offerings, mapped like `courses`
let catalogLoaded = false, catalogLoading = false, catalogError = null;
const finderState = { q: '', program: '', semester: '', professor: '', status: '', sort: 'code', view: 'grid' };

// A course opened from the Finder may not be one of the student's own, so resolve from either set.
function findCourseById(id) {
  return studentCourses.find(x => String(x.id) === String(id))
      || catalogCourses.find(x => String(x.id) === String(id))
      || null;
}
// A course's full program set = its (clean) lead program plus any cross-listings,
// each an individual program — never a combined "A, B, C" string. Used for both
// the Program dropdown options and the Program filter so both stay to the 5.
function courseProgramSet(c) {
  const set = new Set();
  String(c.program || '').split(',').forEach(p => { p = p.trim(); if (p) set.add(p); });
  (c.crossListed || []).forEach(p => { p = String(p).trim(); if (p) set.add(p); });
  return set;
}
// A co-taught offering stores its professors as a comma-joined string
// ("Seongkyu Park, James Ostler"). Split into individual names so the Professor
// dropdown/filter deal in unique people, never a combined "A, B" entry.
function courseProfessorList(c) {
  return String(c.professor || '').split(',').map(s => s.trim()).filter(Boolean);
}
function backToList() {
  location.hash = courseOrigin().hash;
}

async function loadFinderData() {
  if (catalogLoaded || catalogLoading) return;
  catalogLoading = true; catalogError = null;
  try {
    // Same columns as loadData(), but WITHOUT the professor_email filter so the
    // whole catalog (all professors) comes back. Requires an RLS policy granting
    // faculty read access to every course_offerings row (not just their own).
    // Published offerings only (RLS does this for students; the filter also covers a faculty preview).
    const rows = await sbGet(TBL_OFFERINGS, `status=eq.published&select=${OFFERING_SELECT}&order=course_base_id.asc`);
    catalogCourses = (rows || []).map(mapCourse);
    catalogLoaded = true;
  } catch (e) {
    catalogError = e.message || String(e);
  }
  catalogLoading = false;
  // Re-render whichever view is waiting on this data.
  if (location.hash === '#finder') renderFinder();
  else if (location.hash.startsWith('#course/')) renderCoursePage();
}

  const progSet = new Set();
  catalogCourses.forEach(c => courseProgramSet(c).forEach(p => progSet.add(p)));
  // Order by the canonical PROGRAM_OPTIONS list (Innovation Foundations first …
  // Business Innovation last); anything not in that list falls to the end.
  const programs = [...progSet].sort((a, b) => {
    const ia = PROGRAM_OPTIONS.indexOf(a), ib = PROGRAM_OPTIONS.indexOf(b);
    return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib) || a.localeCompare(b);
  });
  const semesters = [...new Set(catalogCourses.map(c => c.semester).filter(Boolean))].sort((a, b) => semesterSortKey(b) - semesterSortKey(a));
  // Real names A→Z, with the "TBD" placeholder always pinned to the very end.
  const profSet = new Set();
  catalogCourses.forEach(c => courseProfessorList(c).forEach(p => profSet.add(p)));
  // Unique individual names A→Z, with "TBD" pinned to the very end.
  const profs = [...profSet].sort((a, b) => (a === 'TBD') - (b === 'TBD') || a.localeCompare(b));
  const opt = (v, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(v)}</option>`;
  const s = finderState;

  el.innerHTML = finderHeaderHtml() + `
    <div class="cf-search ${s.q ? 'has-text' : ''}" id="cf-search">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.7" stroke="currentColor" stroke-width="1.5"/><path d="m13.2 13.2-2.8-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="cf-q" type="text" placeholder="Search by course code, title, professor, or keyword…" autocomplete="off" value="${esc(s.q)}">
      <button class="cf-clearbtn" id="cf-clearbtn" title="Clear">&times;</button>
    </div>
    <div class="cf-filters">
      <div class="cf-select-wrap"><select class="cf-select ${s.program ? 'set' : ''}" id="cf-f-program"><option value="">All programs</option>${programs.map(p => opt(p, s.program)).join('')}</select></div>
      <div class="cf-select-wrap"><select class="cf-select ${s.semester ? 'set' : ''}" id="cf-f-semester"><option value="">All semesters</option>${semesters.map(x => opt(x, s.semester)).join('')}</select></div>
      <div class="cf-select-wrap"><select class="cf-select ${s.professor ? 'set' : ''}" id="cf-f-professor"><option value="">All professors</option>${profs.map(p => opt(p, s.professor)).join('')}</select></div>
      <div class="cf-results-right">
        <div class="cf-select-wrap"><select class="cf-select" id="cf-f-sort">
          <option value="code" ${s.sort === 'code' ? 'selected' : ''}>Sort: Code</option>
          <option value="title" ${s.sort === 'title' ? 'selected' : ''}>Sort: Title</option>
          <option value="semnew" ${s.sort === 'semnew' ? 'selected' : ''}>Sort: Newest semester</option>
          <option value="prof" ${s.sort === 'prof' ? 'selected' : ''}>Sort: Professor</option>
        </select></div>
        <div class="view-toggle">
          <button class="view-btn ${s.view === 'grid' ? 'active' : ''}" id="cf-v-grid" title="Grid view">${finderGridIcon()}</button>
          <button class="view-btn ${s.view === 'list' ? 'active' : ''}" id="cf-v-list" title="List view">${finderListIcon()}</button>
        </div>
      </div>
    </div>
    <div class="cf-results-hd"><div class="cf-count" id="cf-count"></div></div>
    <div id="cf-results"></div>`;

  const q = document.getElementById('cf-q'), box = document.getElementById('cf-search');
  q.addEventListener('input', () => { finderState.q = q.value.trim(); box.classList.toggle('has-text', !!q.value); applyFinder(); });
  document.getElementById('cf-clearbtn').addEventListener('click', () => { q.value = ''; finderState.q = ''; box.classList.remove('has-text'); applyFinder(); q.focus(); });
  const bind = (id, key) => { const sel = document.getElementById(id); sel.addEventListener('change', () => { finderState[key] = sel.value; sel.classList.toggle('set', !!sel.value); applyFinder(); }); };
  bind('cf-f-program', 'program'); bind('cf-f-semester', 'semester'); bind('cf-f-professor', 'professor');
  document.getElementById('cf-f-sort').addEventListener('change', e => { finderState.sort = e.target.value; applyFinder(); });
  document.getElementById('cf-v-grid').addEventListener('click', () => { finderState.view = 'grid'; renderFinder(); });
  document.getElementById('cf-v-list').addEventListener('click', () => { finderState.view = 'list'; renderFinder(); });
  applyFinder();
}

function applyFinder() {
  const s = finderState;
  let rows = catalogCourses.filter(c => {
    const progs = [...courseProgramSet(c)];                          // individual programs only
    if (s.program && !progs.includes(s.program)) return false;       // matches lead OR a cross-listing
    if (s.semester && c.semester !== s.semester) return false;
    if (s.professor && !courseProfessorList(c).includes(s.professor)) return false;  // co-taught: match any listed professor
    if (s.status && c.status !== s.status) return false;
    if (s.q) {
      const hay = [c.code, c.title, c.professor, progs.join(' '), c.description].join(' ').toLowerCase();
      if (!hay.includes(s.q.toLowerCase())) return false;
    }
    return true;
  });
  rows.sort((a, b) =>
    s.sort === 'title'  ? String(a.title).localeCompare(String(b.title)) :
    s.sort === 'prof'   ? String(a.professor || '').localeCompare(String(b.professor || '')) || String(a.code).localeCompare(String(b.code)) :
    s.sort === 'semnew' ? semesterSortKey(b.semester) - semesterSortKey(a.semester) || String(a.code).localeCompare(String(b.code)) :
                          String(a.code).localeCompare(String(b.code)) || semesterSortKey(b.semester) - semesterSortKey(a.semester)
  );
  const cnt = document.getElementById('cf-count');
  if (cnt) cnt.innerHTML = `${rows.length} course${rows.length === 1 ? '' : 's'} <span class="n">of ${catalogCourses.length} in catalog</span>`;
  const host = document.getElementById('cf-results');
  if (!host) return;
  if (!rows.length) {
    host.innerHTML = `<div class="list-card"><div class="empty-row">No matching courses — try a different keyword or filter.</div></div>`;
    return;
  }
  host.innerHTML = finderState.view === 'grid'
    ? `<div class="course-grid">${rows.map(courseCardHtml).join('')}</div>`
    : `<div class="list-card">${rows.map(courseListRowHtml).join('')}</div>`;
}

// ── RENDER: This semester ──
function renderThisSemester() {
  const list = studentCourses.filter(c => c.semester === CURRENT_SEMESTER).sort((a, b) => a.code.localeCompare(b.code));
  const el = document.getElementById('this-semester-body');
  if (!list.length) { el.innerHTML = `<div class="list-card"><div class="empty-row">No courses this semester yet.</div></div>`; return; }
  el.innerHTML = viewMode.thisSemester === 'grid'
    ? `<div class="course-grid">${list.map(courseCardHtml).join('')}</div>`
    : `<div class="list-card">${list.map(courseListRowHtml).join('')}</div>`;
}

// ── RENDER: Upcoming (semester-marker timeline, nearest semester first) ──
function renderUpcoming() {
  const el = document.getElementById('upcoming-body');
  const list = studentCourses.filter(isUpcomingCourse);
  if (!list.length) { el.innerHTML = `<div class="timeline-card"><div class="empty-row" style="padding:8px 0;">No upcoming courses scheduled.</div></div>`; return; }

  const groups = {};
  // A course planned in Telos with no term yet goes last, under 'Term not set'.
  list.forEach(c => { const k = c.semester || 'Term not set'; (groups[k] = groups[k] || []).push(c); });
  // Nearest semester first (ascending), opposite of Course History's most-recent-first order.
  const ordered = Object.entries(groups).sort(([a], [b]) => (semesterSortKey(a) || 1e9) - (semesterSortKey(b) || 1e9));

  const rows = ordered.map(([semester, group], idx) => {
    const isLast = idx === ordered.length - 1;
    const sorted = [...group].sort((a, b) => a.code.localeCompare(b.code));
    const body = viewMode.upcoming === 'grid'
      ? `<div class="course-grid">${sorted.map(courseCardHtml).join('')}</div>`
      : `<div class="list-card">${sorted.map(courseListRowHtml).join('')}</div>`;
    return `
      <div class="tl-row">
        <div class="tl-spine">
          <span class="tl-dot" style="background:${idx === 0 ? 'var(--blue-m)' : 'var(--text3)'};"></span>
          ${isLast ? '' : '<span class="tl-line"></span>'}
        </div>
        <div class="tl-body">
          <p class="tl-sem">${esc(semester)} <span class="n">· ${group.length} course${group.length > 1 ? 's' : ''}</span></p>
          ${body}
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `<div class="timeline-card">${rows}</div>`;
}

// ── RENDER: This week timetable ──
function renderTimetable() {
  const el = document.getElementById('timetable-body');
  const tzEl = document.getElementById('tt-tz-label');
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const thisSem = studentCourses.filter(c => c.semester === CURRENT_SEMESTER && c.scheduleDays.length && c.startTime);
  if (tzEl) tzEl.textContent = thisSem.length ? `· times shown in ${tzLabel(myTz)}` : '';
  if (!thisSem.length) {
    el.innerHTML = `<div class="timetable-card"><div class="empty-row" style="padding:8px 0;">No classes scheduled this semester.</div></div>`;
    return;
  }

  const toHour = (t) => parseInt(t.split(':')[0], 10);
  const durOf = (c) => {
    const [sh, sm] = c.startTime.split(':').map(Number);
    if (!c.endTime) return DEFAULT_DURATION_MIN;
    const [eh, em] = c.endTime.split(':').map(Number);
    const d = (eh * 60 + em) - (sh * 60 + sm);
    return d > 0 ? d : DEFAULT_DURATION_MIN;
  };
  // Every course may be taught in a different timezone, so convert each meeting
  // into the professor's own timezone (myTz) — the whole grid then reads in one
  // consistent zone (labelled next to the title), and a day can shift (e.g. a
  // Mon evening class in Pacific becomes Tue morning in Korea).
  const meetings = [];
  thisSem.forEach((c) => {
    const dur = durOf(c);
    c.scheduleDays.forEach((day) => {
      let mday = day, mstart = c.startTime, mend = c.endTime || addMinutesToTimeStr(c.startTime, dur);
      if (c.classTimezone && c.classTimezone !== myTz) {
        const r = convertDayToZone(day, c.startTime, dur, '', c.classTimezone, myTz);
        mday = r.weekday; mstart = r.startTime; mend = r.endTime;
      }
      meetings.push({ code: c.code, title: c.title, day: mday, start: mstart, end: mend });
    });
  });

  let minHour = Math.min(...meetings.map(m => toHour(m.start)));
  let maxHour = Math.max(...meetings.map(m => toHour(m.end) + (m.end.split(':')[1] > '00' ? 1 : 0)));
  if (maxHour <= minHour) maxHour = minHour + 1;
  const hourCount = maxHour - minHour;

  const todayAbbr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date().getDay()];
  const colorMap = {};
  meetings.forEach((m) => { if (!colorMap[m.code]) colorMap[m.code] = COURSE_COLORS[Object.keys(colorMap).length % COURSE_COLORS.length]; });

  let cells = '';
  cells += `<div class="tt-daylabel" style="grid-row:1;grid-column:1;font-size:13px;color:var(--text3);">Time</div>`;
  DAY_ORDER.forEach((d, idx) => {
    const isToday = d === todayAbbr;
    cells += `<div class="tt-daylabel ${isToday ? 'today' : ''}" style="grid-row:1;grid-column:${idx + 2};">${d}</div>`;
  });
  for (let h = 0; h < hourCount; h++) {
    cells += `<div class="tt-hour" style="grid-row:${h + 2};grid-column:1;">${minHour + h}</div>`;
  }
  meetings.forEach((m) => {
    const colIndex = DAY_ORDER.indexOf(m.day);
    if (colIndex === -1) return;   // shifted onto Sat/Sun — not shown in the Mon–Fri grid
    const startRow = toHour(m.start) - minHour + 2;
    const endHour = toHour(m.end) + (m.end.split(':')[1] > '00' ? 1 : 0);
    const span = Math.max(1, endHour - toHour(m.start));
    const color = colorMap[m.code];
    cells += `<div class="tt-block" title="${esc(m.code + ' — ' + m.title)}" style="grid-column:${colIndex + 2};grid-row:${startRow} / span ${span};background:${color.bg};">
      <span class="code" style="color:${color.text};">${esc(m.code)}</span>
      <span class="title" style="color:${color.text};">${esc(m.title)}</span>
    </div>`;
  });

  el.innerHTML = `<div class="timetable-card"><div class="tt-wrap">
    <div class="tt-grid" style="grid-template-columns:48px repeat(5,1fr);grid-template-rows:28px repeat(${hourCount},40px);">${cells}</div>
  </div></div>`;
}

// ── RENDER: Course history ──
function renderHistory() {
  const el = document.getElementById('history-body');
  const past = studentCourses.filter(c => semesterSortKey(c.semester) < CURRENT_KEY);
  if (!past.length) { el.innerHTML = `<div class="timeline-card"><div class="empty-row" style="padding:8px 0;">No completed courses yet.</div></div>`; return; }

  const groups = {};
  past.forEach(c => { (groups[c.semester] = groups[c.semester] || []).push(c); });
  const ordered = Object.entries(groups).sort(([a], [b]) => semesterSortKey(b) - semesterSortKey(a));

  const VISIBLE = 3;
  const visibleGroups = historyExpanded ? ordered : ordered.slice(0, VISIBLE);
  const hiddenGroups = historyExpanded ? [] : ordered.slice(VISIBLE);
  const hiddenCount = hiddenGroups.reduce((sum, [, list]) => sum + list.length, 0);

  let rows = visibleGroups.map(([semester, list], idx) => {
    const isLast = idx === visibleGroups.length - 1 && !hiddenGroups.length;
    const sorted = [...list].sort((a, b) => a.code.localeCompare(b.code));
    const body = viewMode.history === 'grid'
      ? `<div class="course-grid">${sorted.map(courseCardHtml).join('')}</div>`
      : `<div class="list-card">${sorted.map(courseListRowHtml).join('')}</div>`;
    return `
      <div class="tl-row">
        <div class="tl-spine">
          <span class="tl-dot" style="background:${idx === 0 ? 'var(--blue-m)' : 'var(--text3)'};"></span>
          ${isLast ? '' : '<span class="tl-line"></span>'}
        </div>
        <div class="tl-body">
          <p class="tl-sem">${esc(semester)} <span class="n">· ${list.length} course${list.length > 1 ? 's' : ''}</span></p>
          ${body}
        </div>
      </div>`;
  }).join('');

  if (hiddenGroups.length) {
    const oldest = hiddenGroups[hiddenGroups.length - 1][0];
    const newest = hiddenGroups[0][0];
    rows += `
      <div class="tl-row">
        <div class="tl-spine"><span class="tl-dot" style="background:var(--border-em);"></span></div>
        <div class="tl-body" style="padding-bottom:10px;">
          <button class="tl-more" onclick="historyExpanded=true;renderHistory();">
            Show ${esc(newest)} – ${esc(oldest)} · ${hiddenCount} more course${hiddenCount > 1 ? 's' : ''}
          </button>
        </div>
      </div>`;
  }

  el.innerHTML = `<div class="timeline-card">${rows}</div>`;
}

// Data loads after sign-in, not here.
// A refresh with a stored session (sessionStorage) enters the app directly; otherwise the sign-in wall stays.
(async () => {
  // a stored session: keep the wall out of sight while it is restored (no flash of the sign-in form)
  try { if (newestSession()) document.getElementById('login-wall').style.display = 'none'; } catch (e) {}
  if (await restoreSession()) {
    try { await enterApp(supabaseUser.user?.email || '', true); }
    catch (e) { console.warn('restore failed:', e); supabaseUser = null; clearSession(); document.getElementById('login-wall').style.display = 'flex'; }
  } else document.getElementById('login-wall').style.display = 'flex';
})();
</script>
